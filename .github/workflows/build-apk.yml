name: Compilation de l'APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Le SDK Android est préinstallé sur les machines GitHub (ANDROID_HOME) :
      # on y ajoute seulement la plateforme utilisée par le projet.
      - name: Installer la plateforme Android 37
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "sdkmanager : $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Préparer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: PVLycee-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier l'APK Raccourcis
        uses: actions/upload-artifact@v4
        with:
          name: Raccourcis-debug-apk
          path: raccourcis/build/outputs/apk/debug/raccourcis-debug.apk
          if-no-files-found: error
          retention-days: 30
